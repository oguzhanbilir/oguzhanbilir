# Weekly language card for the profile README
name: Language stats

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/languages.yml"
      - ".github/scripts/languages.py"

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build languages.svg
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python .github/scripts/languages.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/languages.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update language stats"
          git pull --rebase
          git push
